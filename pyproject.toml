[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "projeto_estacionamento"
version = "1.0.0"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]

[tool.ruff]
# Mantém os diretórios padrão que o Ruff já ignora (.venv, .git, etc.) 
# e adiciona os seguintes diretórios que quero ignorar:
extend-exclude = [
    "diagnostico",
    "drills",
]